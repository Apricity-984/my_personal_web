site_name: 我的个人博客
site_description: 记录技术、阅读与日常想法
site_author: 站点作者

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 博客:
      - blog/index.md
      - 技术: blog/technology.md
      - 随笔: blog/essays.md
      - 周刊: blog/weekly.md
  - 笔记:
      - notes/index.md
      - 阅读: notes/reading.md
      - 学习: notes/study.md
  - 成长路线: roadmap.md
  - 关于: about.md

copyright: Copyright &copy; 2026 我的个人博客
